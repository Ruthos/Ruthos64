[workspace]
resolver = "2"
members = [
    "crates/ruthos-core",
    "crates/ruthos-dicom",
    "crates/ruthos-net",
    "crates/ruthos-render",
    "crates/ruthos-segment",
    "crates/ruthos-session",
    "crates/ruthos-ui",
    "crates/ruthos",
]
exclude = ["vendor/openjpeg-sys"]

[workspace.package]
version = "0.1.7-alpha"
edition = "2021"
license = "LGPL-3.0-only"
repository = "https://github.com/Ruthos/Ruthos64"
authors = ["The Ruthos contributors"]
rust-version = "1.92"

[workspace.dependencies]
ruthos-core = { path = "crates/ruthos-core" }
ruthos-dicom = { path = "crates/ruthos-dicom" }
ruthos-net = { path = "crates/ruthos-net" }
ruthos-render = { path = "crates/ruthos-render" }
ruthos-segment = { path = "crates/ruthos-segment" }
ruthos-session = { path = "crates/ruthos-session" }
ruthos-ui = { path = "crates/ruthos-ui" }

# UI and GPU
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
egui = "0.37"
egui_extras = "0.37"
egui-wgpu = "0.37"
wgpu = "30.0"
bytemuck = { version = "1.25", features = ["derive"] }

# DICOM
dicom-core = "0.10"
dicom-object = "0.10"
dicom-dictionary-std = "0.10"
dicom-encoding = "0.10"
dicom-parser = "0.10"
dicom-pixeldata = { version = "0.10", default-features = false, features = ["native", "rayon", "openjpeg-sys", "charls", "image"] }
dicom-ul = "0.10"
dicom-transfer-syntax-registry = "0.10"
turbojpeg-sys = { version = "1.2", default-features = false, features = ["cmake"] }
libc = "0.2"

# Storage and files
rusqlite = { version = "0.41", features = ["bundled"] }
# Cisco's own binary, fetched on the user's consent, never compiled in: Cisco's
# patent cover applies only to the copies it distributes.
openh264 = { version = "0.9.9", default-features = false, features = ["libloading"] }
bzip2-rs = "0.1"
mp4 = "0.14.0"
bytes = "1"
directories = "6.0"
walkdir = "2.5"
notify = "8.2"
rfd = "0.17"
open = "5.4"
plist = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }

# Utilities
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
flate2 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"
crossbeam-channel = "0.5"
uuid = { version = "1.29", features = ["v4"] }
parking_lot = "0.12"

# Guided review (ruthos-session). rustls with the operating system's
# certificate store: networks that inspect TLS install their root there.
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
ed25519-dalek = "2"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2.5"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# OpenJPEG is unmaintained and openjpeg-sys bundles 2.5.3: see vendor/openjpeg-sys/RUTHOS.md.
[patch.crates-io]
openjpeg-sys = { path = "vendor/openjpeg-sys" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
