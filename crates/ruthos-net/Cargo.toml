[package]
name = "ruthos-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The decode guard, for images converted before sending.
ruthos-dicom = { workspace = true }
dicom-core = { workspace = true }
dicom-object = { workspace = true }
dicom-dictionary-std = { workspace = true }
dicom-encoding = { workspace = true }
dicom-ul = { workspace = true }
dicom-transfer-syntax-registry = { workspace = true }
# Converting compressed images for a PACS that accepts only uncompressed ones.
dicom-pixeldata = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
crossbeam-channel = { workspace = true }
# DICOMweb.
base64 = { workspace = true }
bytes = { workspace = true }
crypto_box = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
rcgen = "0.14"
