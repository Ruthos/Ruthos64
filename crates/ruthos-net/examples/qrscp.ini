# pynetdicom qrscp configuration for examples/pacs_check.rs: a PACS on
# 127.0.0.1:11120 (AE QRSCP) that knows Ruthos as a C-MOVE destination.

[DEFAULT]
    ae_title: QRSCP
    port: 11120
    max_pdu: 16382
    acse_timeout: 30
    dimse_timeout: 30
    network_timeout: 30
    bind_address: 127.0.0.1
    instance_location: instances
    database_location: instances.sqlite
    log_identifier: False

[RUTHOS]
    address: 127.0.0.1
    port: 11121
