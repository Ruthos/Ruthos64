[package]
name = "ruthos-dicom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
# A planted out-of-bounds read, proving the fuzzer reaches the C decoders
# (src/jpeg.rs). Refuses to compile outside a fuzz build.
fuzz-canary = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
dicom-core = { workspace = true }
dicom-object = { workspace = true }
dicom-dictionary-std = { workspace = true }
dicom-encoding = { workspace = true }
dicom-pixeldata = { workspace = true }
dicom-transfer-syntax-registry = { workspace = true }
turbojpeg-sys = { workspace = true }
libc = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
plist = { workspace = true }
serde = { workspace = true }
image = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
