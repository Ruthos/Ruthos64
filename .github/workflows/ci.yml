# Every push and pull request: format, lint and test on all three
# platforms. The Apple Silicon runner also compiles the Intel slice, since
# the universal binary's two halves share every line of source.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-about --locked --version 0.9.3 --features cli
      - name: Licences accepted, lists agree, vendored files match, nothing missing
        run: |
          python3 scripts/notices.py check --target x86_64-unknown-linux-gnu
          python3 scripts/notices.py check --target x86_64-pc-windows-msvc
          python3 scripts/notices.py check --target aarch64-apple-darwin x86_64-apple-darwin
      - name: The vendored C is upstream's, plus only what codecs.toml records
        run: python3 scripts/check_codecs.py --verify-vendor
      - name: Version, download size and dates agree (Cargo.toml, Packager.toml, release notes, site)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/stamp_release.py check --online
      - name: The notices, for a reviewer to read
        run: python3 scripts/notices.py build --target x86_64-pc-windows-msvc --out notices
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: notices/

  linux:
    name: Linux (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for winit, wgpu and the file dialogs
        # A runner whose package mirror cannot be reached fails here in
        # minutes, to be run again, rather than hanging for an hour.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y cmake nasm libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxi-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  orthanc:
    name: Interoperability (Orthanc, dciodvfy, highdicom)
    runs-on: ubuntu-latest
    services:
      orthanc:
        image: orthancteam/orthanc:26.9.1
        env:
          DICOM_WEB_PLUGIN_ENABLED: "true"
          ORTHANC__AUTHENTICATION_ENABLED: "true"
          ORTHANC__REGISTERED_USERS: '{"orthanc": "orthanc"}'
          ORTHANC__DICOM_ALWAYS_ALLOW_FIND: "true"
          ORTHANC__DICOM_ALWAYS_ALLOW_GET: "true"
        ports:
          - 8042:8042
          - 4242:4242
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for winit, wgpu and the file dialogs
        # A runner whose package mirror cannot be reached fails here in
        # minutes, to be run again, rather than hanging for an hour.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y cmake nasm libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxi-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Other tools for checking a SEG
        run: |
          sudo apt-get install -y dicom3tools
          pip install highdicom
      - name: Ruthos writes a SEG of three segments
        run: |
          mkdir -p "$RUNNER_TEMP/seg"
          cargo test -p ruthos-dicom --test seg interoperates
        env:
          RUTHOS_SEG_INTEROP: ${{ runner.temp }}/seg
      - name: Ruthos writes an anatomical M-mode strip
        run: cargo test -p ruthos-dicom --test amm a_saved_strip
        env:
          RUTHOS_SEG_INTEROP: ${{ runner.temp }}/seg
      - name: Ruthos writes a measurement report and a key image document
        run: cargo test -p ruthos-dicom --lib sr::tests
        env:
          RUTHOS_SEG_INTEROP: ${{ runner.temp }}/seg
      - name: dciodvfy finds no errors in them
        run: |
          for f in ruthos-seg.dcm ruthos-amm.dcm ruthos-sr.dcm ruthos-kos.dcm; do
            dciodvfy "$RUNNER_TEMP/seg/$f" 2>&1 | tee "$RUNNER_TEMP/dciodvfy-$f.txt"
            ! grep -q '^Error' "$RUNNER_TEMP/dciodvfy-$f.txt"
          done
      - name: highdicom reads every voxel, then writes a SEG of its own
        run: python scripts/seg_interop.py "$RUNNER_TEMP/seg"
      - name: Ruthos reads highdicom's SEG, voxel for voxel
        run: cargo test -p ruthos-dicom --test seg interoperates -- --nocapture
        env:
          RUTHOS_SEG_INTEROP: ${{ runner.temp }}/seg
      - name: Wait for Orthanc and its DICOMweb plugin
        run: |
          for i in $(seq 1 30); do
            curl -fsS -u orthanc:orthanc http://localhost:8042/dicom-web/studies && exit 0
            sleep 2
          done
          exit 1
      - run: cargo test -p ruthos-net --test orthanc -- --nocapture --test-threads=1
        env:
          RUTHOS_ORTHANC_WEB: http://localhost:8042/dicom-web
          RUTHOS_ORTHANC_DIMSE: localhost:4242:ORTHANC
          RUTHOS_ORTHANC_SEG: ${{ runner.temp }}/seg/ruthos-seg.dcm

  windows:
    name: Windows (test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  macos:
    name: macOS (test, Intel slice compiles)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Intel slice
        run: cargo build --workspace --target x86_64-apple-darwin
