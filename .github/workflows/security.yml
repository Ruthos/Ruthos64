# Dependency and codec tracking (Decoder Hardening Specification, section 3).
# cargo-deny on every pull request, every push to main and nightly; the
# bundled C codecs against upstream nightly, opening an issue when one
# needs attention.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Advisories, licences and sources (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  codecs:
    name: Bundled C codecs against upstream
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Make sure the label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create security --color B60205 --description "Security-relevant" 2>/dev/null || true
      - name: Compare codecs.toml with upstream releases and the NVD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_codecs.py --open-issues
      - name: The vendored C is upstream's, plus only what codecs.toml records
        run: python scripts/check_codecs.py --verify-vendor
