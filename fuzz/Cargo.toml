# Fuzz targets for everything that parses bytes Ruthos did not create
# (docs/security.md, Decoder Hardening Specification section 2). Run with
# cargo-fuzz on nightly Rust, Linux:
#   cargo +nightly fuzz run decode_frame -- -max_total_time=60
# The C codecs are instrumented too: the fuzz workflow sets CC=clang and
# CFLAGS/CXXFLAGS to -fsanitize=address -fsanitize=fuzzer-no-link -g.
[package]
name = "ruthos-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
ruthos-dicom = { path = "../crates/ruthos-dicom" }
ruthos-core = { path = "../crates/ruthos-core" }
ruthos-session = { path = "../crates/ruthos-session" }
chrono = "0.4"

[features]
# The nightly job's proof that the C codecs are reached and watched.
canary = ["ruthos-dicom/fuzz-canary"]

# Not part of the Ruthos workspace.
[workspace]
members = ["."]

# OpenJPEG is unmaintained and openjpeg-sys bundles 2.5.3: see vendor/openjpeg-sys/RUTHOS.md.
[patch.crates-io]
openjpeg-sys = { path = "../vendor/openjpeg-sys" }

[profile.release]
debug = 1

[[bin]]
name = "open_file"
path = "fuzz_targets/open_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_frame"
path = "fuzz_targets/decode_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jpeg_codestream"
path = "fuzz_targets/jpeg_codestream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "guard_headers"
path = "fuzz_targets/guard_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "anonymise"
path = "fuzz_targets/anonymise.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sidecar"
path = "fuzz_targets/sidecar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "profile_and_link"
path = "fuzz_targets/profile_and_link.rs"
test = false
doc = false
bench = false
