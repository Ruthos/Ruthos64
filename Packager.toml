# cargo-packager configuration: Ruthos.app and a disk image on macOS, an
# AppImage on Linux. Windows ships as a zip from release.yml; an installer
# comes with the signing work.
#
#   cargo install cargo-packager --locked
#   cargo build --release
#   cargo packager --release
#
# On macOS, cargo-packager signs and notarises when APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are set in the environment.

# The package it packages: the workspace root has no [package] of its own,
# and without this cargo-packager quietly skips the whole file.
name = "ruthos"
product-name = "Ruthos"
identifier = "org.ruthos.Ruthos"
version = "0.1.16-alpha"
description = "A Horos-inspired DICOM viewer and patient archive"
long-description = "Ruthos is a community, open-source DICOM viewer and patient archive inspired by Horos: an archive with a DICOM listener, a 2D viewer, measurements with a stated scale basis, reports, and teaching anonymisation."
authors = ["The Ruthos contributors"]
homepage = "https://github.com/Ruthos/Ruthos64"
license-file = "LICENSE"
publisher = "Ruthos"
category = "Utility"
out-dir = "dist"

# Where the built binary is; release.yml puts the universal macOS binary here too.
binaries-dir = "target/release"
binaries = [{ path = "ruthos", main = true }]

# The application icon; cargo-packager builds the .icns for Ruthos.app from
# these. The Windows executable embeds assets/icon/ruthos.ico (crates/ruthos/build.rs).
icons = [
  "assets/icon/ruthos-16.png",
  "assets/icon/ruthos-32.png",
  "assets/icon/ruthos-64.png",
  "assets/icon/ruthos-128.png",
  "assets/icon/ruthos-256.png",
]

# Formats are chosen per platform in release.yml (--formats).

# release.yml writes these before packaging; `scripts/notices.py` makes them by hand.
resources = [
  { src = "notices/THIRD_PARTY_LICENSES.html", target = "THIRD_PARTY_LICENSES.html" },
  { src = "notices/THIRD_PARTY_LICENSES.txt", target = "THIRD_PARTY_LICENSES.txt" },
]

[[file-associations]]
extensions = ["dcm", "dicom", "dic"]
mime-type = "application/dicom"
description = "DICOM image"
name = "DICOM"
role = "viewer"

[macos]
minimum-system-version = "11.0"
info-plist-path = "packaging/macos/Info.plist"

[appimage]
# appimagetool is fetched by cargo-packager; libfuse2 must be installed.
